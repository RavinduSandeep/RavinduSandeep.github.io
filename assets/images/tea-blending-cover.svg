<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'JetBrains Mono','Segoe UI',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13171d"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <text x="48" y="70" fill="#f5a524" font-size="15" letter-spacing="3">SUPERVISORY CONTROL</text>
  <text x="48" y="108" fill="#eef1f5" font-size="30" font-weight="600" font-family="'Sora','Segoe UI',sans-serif">Automated Tea Blending</text>

  <!-- schematic flow -->
  <g font-size="14" fill="#cfd6df">
    <!-- connectors -->
    <g stroke="#f5a524" stroke-width="2" opacity="0.85">
      <line x1="170" y1="230" x2="250" y2="230"/>
      <line x1="410" y1="230" x2="490" y2="230"/>
      <line x1="620" y1="230" x2="620" y2="300"/>
    </g>
    <circle cx="210" cy="230" r="3" fill="#f5a524"/>
    <circle cx="450" cy="230" r="3" fill="#f5a524"/>

    <!-- node: sensors -->
    <rect x="48" y="196" width="122" height="68" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="62" y="226" fill="#8b93a0" font-size="11">01</text>
    <text x="62" y="246" fill="#eef1f5">Sensors</text>

    <!-- node: firmware MCU -->
    <rect x="250" y="196" width="160" height="68" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="266" y="226" fill="#8b93a0" font-size="11">02</text>
    <text x="266" y="246" fill="#eef1f5">Firmware · MCU</text>

    <!-- node: RPi5 supervisory -->
    <rect x="490" y="196" width="180" height="68" rx="10" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-opacity="0.55"/>
    <text x="506" y="226" fill="#f5a524" font-size="11">03</text>
    <text x="506" y="246" fill="#eef1f5">Raspberry Pi 5</text>

    <!-- node: recipe / dispense -->
    <rect x="530" y="300" width="180" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="546" y="336" fill="#eef1f5">Recipe · Dispense</text>
  </g>

  <text x="48" y="410" fill="#6b7480" font-size="13">London · Cyprus collaboration &#8226; SolidWorks &#8226; Firmware &#8226; Supervisory control</text>
</svg>
